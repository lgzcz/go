<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 聊天</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --card-bg: #f9fafb;
            --border-color: #e5e7eb;
            --text-color: #111827;
            --text-light: #6b7280;
            --primary-color: #2563eb;
            --border-radius-sm: 10px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: var(--bg-color);
            margin: 0;
            padding: 0;
        }

        #ai-page {
            display: flex !important;
            flex-direction: column;
            height: 100vh;
            max-width: 900px;
            margin: 0 auto;
            padding: 16px;
            gap: 12px;
        }

        .ai-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-sm);
            flex-shrink: 0;
        }

        .ai-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #e0f2fe, #bae6fd);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0284c7;
            flex-shrink: 0;
        }

        .ai-avatar svg {
            width: 28px;
            height: 28px;
        }

        .ai-info {
            flex: 1;
            min-width: 0;
        }

        .ai-info h2 {
            margin: 0;
            font-size: 1.1rem;
            color: var(--text-color);
            font-weight: 600;
        }

        .ai-status {
            margin: 4px 0 0 0;
            font-size: 0.85rem;
            color: var(--text-light);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #22c55e;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .ai-messages {
            flex: 1;
            overflow-y: auto;
            padding: 8px 4px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }

        .ai-bubble {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.6;
            word-break: break-word;
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .ai-bubble.user {
            align-self: flex-end;
            background: var(--primary-color);
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .ai-bubble.bot {
            align-self: flex-start;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-bottom-left-radius: 4px;
        }

        .ai-input-area {
            display: flex;
            gap: 8px;
            padding: 8px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-sm);
            flex-shrink: 0;
        }

        #ai-input {
            flex: 1;
            padding: 10px 12px;
            border: none;
            border-radius: 6px;
            background: white;
            color: var(--text-color);
            outline: none;
            font-size: 0.95rem;
            resize: none;
            max-height: 120px;
            line-height: 1.5;
        }

        .ai-send-btn {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 8px;
            background: var(--primary-color);
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ai-footer {
            display: flex;
            justify-content: space-between;
            padding: 4px 8px;
            font-size: 0.75rem;
            color: var(--text-light);
        }

        .thinking {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .thinking span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #999;
            animation: bounce 1.4s infinite;
        }

        .thinking span:nth-child(2) { animation-delay: 0.2s; }
        .thinking span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}
        }

        #ai-selection-bar {display:none;}
    </style>
</head>
<body>

<main class="content" id="ai-page">
  <div class="ai-header">
    <div class="ai-avatar">
      <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z" />
      </svg>
    </div>
    <div class="ai-info">
      <h2>雪域智狐 AI</h2>
      <p class="ai-status"><span class="status-dot"></span> 在线</p>
    </div>
  </div>

  <div id="ai-messages" class="ai-messages"></div>

  <div class="ai-input-area">
    <textarea id="ai-input" placeholder="输入问题..." rows="1"></textarea>
    <button id="ai-send-btn" class="ai-send-btn">发送</button>
  </div>

  <div class="ai-footer">
    <span>AI 聊天助手</span>
  </div>
</main>

<script>
// ====================== 智谱 API 配置 ======================
const API_KEY = "7a731303e72744e287a21daa021eaa3f.fMYf7XN1zGJLrQqs";
const API_URL = "https://open.bigmodel.cn/api/paas/v4/chat/completions";
const MODEL = "glm-4.7-flash";
// ============================================================

const messagesEl = document.getElementById('ai-messages');
const inputEl = document.getElementById('ai-input');
const sendBtn = document.getElementById('ai-send-btn');

// 添加消息
function addMsg(sender, text, isThinking = false) {
    const div = document.createElement('div');
    div.className = 'ai-bubble ' + sender;
    if (isThinking) {
        div.innerHTML = '<div class="thinking"><span></span><span></span><span></span></div>';
    } else {
        div.innerText = text;
    }
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
}

// 欢迎语
addMsg('bot', '你好！我是雪域智狐 AI，有什么可以帮你？');

sendBtn.onclick = send;
inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send();
    }
});

async function send() {
    const text = inputEl.value.trim();
    if (!text) return;

    addMsg('user', text);
    inputEl.value = '';
    const botMsg = addMsg('bot', '', true);

    try {
        const response = await fetch(API_URL, {
            method: "POST",
            headers: {
                "Authorization": `Bearer ${API_KEY}`,
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                model: MODEL,
                messages: [
                    { role: "user", content: text }
                ],
                stream: false
            })
        });

        const data = await response.json();
        const reply = data.choices?.[0]?.message?.content || "抱歉，我没理解你的意思。";
        botMsg.innerText = reply;
        messagesEl.scrollTop = messagesEl.scrollHeight;
    } catch (err) {
        botMsg.innerText = "❌ 连接 AI 失败：" + err.message;
    }
}
</script>
</body>
</html>
